services:
  database:
    build: ../database
    environment:
      POSTGRES_DB: fimafengdb
      POSTGRES_USER: fimafeng
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network

  announce-manager:
    build:
      context: ..
      dockerfile: announce-manager/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/fimafengdb
      - SPRING_DATASOURCE_USERNAME=fimafeng
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - database
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
