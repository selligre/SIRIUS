services:
  # Base de données
  database:
    build: ./database
    environment:
      POSTGRES_DB: fimafengdb
      POSTGRES_USER: fimafeng
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network

  # Notification collector: HAProxy + 2 Kafka brokers
  notif-lb:
    image: haproxy:2.8
    container_name: notif-kafka-lb
    ports:
      - "9092:9092"
    volumes:
      - ./notifications-collector/haproxy_local.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - notif-kafka1
      - notif-kafka2
      - notif-kafka3
    networks:
      - app-network

  notif-kafka1:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@notif-kafka1:9093,2@notif-kafka2:9093,3@notif-kafka3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://notif-kafka1:9092,EXTERNAL://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9094:9094"
    volumes:
      - notif_kafka1_data:/var/lib/kafka/data
    networks:
      - app-network

  notif-kafka2:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@notif-kafka1:9093,2@notif-kafka2:9093,3@notif-kafka3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://notif-kafka2:9092,EXTERNAL://localhost:9095'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9095:9095"
    volumes:
      - notif_kafka2_data:/var/lib/kafka/data
    networks:
      - app-network
  
  notif-kafka3:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@notif-kafka1:9093,2@notif-kafka2:9093,3@notif-kafka3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://notif-kafka3:9092,EXTERNAL://localhost:9096'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9096:9096"
    volumes:
      - notif_kafka3_data:/var/lib/kafka/data
    networks:
      - app-network


  # Backend Java (Search)
  search:
    build:
      context: .
      dockerfile: search/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/fimafengdb
      - SPRING_DATASOURCE_USERNAME=fimafeng
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - database
    networks:
      - app-network
    
  announce-manager:
    build:
      context: .
      dockerfile: announce-manager/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/fimafengdb
      - SPRING_DATASOURCE_USERNAME=fimafeng
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - database
    networks:
      - app-network

  notification-manager:
    build:
      context: .
      dockerfile: notification-manager/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/fimafengdb
      - SPRING_DATASOURCE_USERNAME=fimafeng
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - database
    networks:
      - app-network
  
  notification-sender:
    build:
      context: .
      dockerfile: notification-sender/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/fimafengdb
      - SPRING_DATASOURCE_USERNAME=fimafeng
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - database
    networks:
      - app-network

  # Frontend React
  web-server:
    build: 
      context: .
      dockerfile: ./web-server/Dockerfile_compose
    ports:
      - "3000:80"
    depends_on:
      - search
      - announce-manager
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  notif_kafka1_data:
  notif_kafka2_data:
  notif_kafka3_data: