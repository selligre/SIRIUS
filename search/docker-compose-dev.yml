services:
  search:
    build:
      context: ..
      dockerfile: search/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev  
    volumes:
      # On monte un dossier local pour stocker les fichiers de logs
      - ./logs:/var/log/search_service
    # On surcharge la commande pour générer un fichier de log avec un timestamp
    command: >
      sh -c "TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
      nginx -g 'daemon off;' 2>&1 | tee /var/log/search_service/session_$$TIMESTAMP.log"

