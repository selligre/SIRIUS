spring.application.name=fimafeng-notifications-service
application.short-name=notif

# Postgres DataSource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/fimafengdb
spring.datasource.username=fimafeng

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.address=0.0.0.0
server.port=8080
access.allow.origin=*

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5p) [${application.short-name}] %clr(%36.36c{36}){cyan}%clr(:%-3L){faint}   - %m%n
spring.output.ansi.enabled=ALWAYS

# Kafka
spring.kafka.bootstrap-servers=notif-lb:9092,notif-kafka1:9092,notif-kafka2:9092
# Reduce blocking metadata wait to avoid long delays when brokers are unreachable
spring.kafka.properties.max.block.ms=2000